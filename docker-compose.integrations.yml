services:
  jobspy:
    build:
      context: ./integrations/jobspy
    container_name: opportunity-os-jobspy
    restart: unless-stopped
    ports:
      - '127.0.0.1:8001:8001'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
